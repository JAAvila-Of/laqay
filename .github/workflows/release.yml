name: Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Release operation
        type: choice
        required: true
        default: prepare
        options:
          - prepare
          - publish
      immutability_confirmed:
        description: For publish, confirm an administrator just checked release immutability is enabled
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - name: Require the administrative preflight for publication
        if: inputs.action == 'publish'
        shell: pwsh
        env:
          IMMUTABILITY_CONFIRMED: ${{ inputs.immutability_confirmed }}
        run: |
          if ($env:IMMUTABILITY_CONFIRMED -ne 'true') { throw 'Check release immutability with administrator access before dispatching publication.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Validate the portable delivery before release operations
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 | Set-Content -Encoding utf8 target/metadata.json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          python scripts/collect-cargo-licenses.py target/metadata.json target/THIRD_PARTY_LICENSES.txt
          if ($LASTEXITCODE -ne 0) { throw 'License collection failed.' }
          python scripts/test-distribution.py
          if ($LASTEXITCODE -ne 0) { throw 'Distribution regression tests failed.' }
          python scripts/test-release-delivery.py
          if ($LASTEXITCODE -ne 0) { throw 'Release delivery regression tests failed.' }
          ./scripts/Test-VersionResource.ps1 -BinaryPath target/x86_64-pc-windows-msvc/release/laqay.exe -MetadataPath target/metadata.json
          ./scripts/New-Distribution.ps1 -BinaryPath target/x86_64-pc-windows-msvc/release/laqay.exe -LicenseTextPath target/THIRD_PARTY_LICENSES.txt
          python scripts/check-distribution.py --binary target/x86_64-pc-windows-msvc/release/laqay.exe --archive target/laqay-windows-x86_64.zip --licenses target/THIRD_PARTY_LICENSES.txt --checksums target/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Distribution validation failed.' }

  release:
    if: github.ref == 'refs/heads/main' && inputs.action == 'publish'
    needs: [validate, release-dependencies]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases: ${{ steps.release.outputs.releases }}
      created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b
        id: release
        with:
          command: release
          version: '0.4.2'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    if: github.ref == 'refs/heads/main' && inputs.action == 'prepare'
    needs: [validate, release-dependencies]
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b
        with:
          command: release-pr
          version: '0.4.2'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          arguments: --all-features --locked

  assets:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        release: ${{ fromJSON(needs.release.outputs.releases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.release.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Check the tag matches the reviewed workflow commit
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -ne $env:SOURCE_COMMIT) { throw 'Release source mismatch.' }
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Collect dependency notices
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 | Set-Content -Encoding utf8 target/metadata.json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          python scripts/collect-cargo-licenses.py target/metadata.json target/THIRD_PARTY_LICENSES.txt
          if ($LASTEXITCODE -ne 0) { throw 'License collection failed.' }
      - name: Package executable and licenses
        shell: pwsh
        run: |
          ./scripts/Test-VersionResource.ps1 -BinaryPath target/x86_64-pc-windows-msvc/release/laqay.exe -MetadataPath target/metadata.json
          python scripts/test-distribution.py
          if ($LASTEXITCODE -ne 0) { throw 'Distribution regression tests failed.' }
          ./scripts/New-Distribution.ps1 -BinaryPath target/x86_64-pc-windows-msvc/release/laqay.exe -LicenseTextPath target/THIRD_PARTY_LICENSES.txt
          python scripts/check-distribution.py --binary target/x86_64-pc-windows-msvc/release/laqay.exe --archive target/laqay-windows-x86_64.zip --licenses target/THIRD_PARTY_LICENSES.txt --checksums target/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Distribution validation failed.' }
      - name: Retain release delivery for inspected recovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-delivery-${{ matrix.release.tag }}
          path: |
            target/x86_64-pc-windows-msvc/release/laqay.exe
            target/laqay-windows-x86_64.zip
            target/SHA256SUMS.txt
            target/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
      - name: Attest release build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            target/x86_64-pc-windows-msvc/release/laqay.exe
            target/laqay-windows-x86_64.zip
            target/SHA256SUMS.txt
          create-storage-record: false
      - name: Upload, verify, and publish the immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ matrix.release.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
          IMMUTABILITY_CONFIRMED: ${{ inputs.immutability_confirmed }}
        run: |
          if ($env:IMMUTABILITY_CONFIRMED -ne 'true') { throw 'Administrative preflight was not confirmed.' }
          python scripts/finalize-release.py --channel stable --immutability-confirmed --tag $env:RELEASE_TAG --commit $env:SOURCE_COMMIT --repository $env:GITHUB_REPOSITORY --binary target/x86_64-pc-windows-msvc/release/laqay.exe --archive target/laqay-windows-x86_64.zip --licenses target/THIRD_PARTY_LICENSES.txt --checksums target/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release delivery failed; inspect the release before recovery.' }
