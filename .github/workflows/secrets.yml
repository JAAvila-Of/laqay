name: Secret scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner with digest verification
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Verify narrow fixture exceptions still detect other secrets
        run: python3 scripts/test-secret-policy.py "$RUNNER_TEMP/gitleaks-bin/gitleaks"
      - name: Scan full available Git history with redacted output
        run: >-
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts=--all
          --config .gitleaks.toml --redact=100 --ignore-gitleaks-allow --no-banner
