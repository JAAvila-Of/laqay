name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Check portable packaging with inert fixtures
        run: |
          python scripts/test-distribution.py
          if ($LASTEXITCODE -ne 0) { throw 'Distribution tests failed.' }
          python scripts/test-release-delivery.py
          if ($LASTEXITCODE -ne 0) { throw 'Release delivery tests failed.' }
      - name: Check disposable desktop lab preparation without creating VMs
        shell: powershell
        run: |
          ./scripts/lab/Test-LabPreparation.ps1
          ./scripts/Test-SessionProbePreparation.ps1
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run automated native and policy tests
        shell: pwsh
        run: |
          cargo test --locked --all-features -- --show-output 2>&1 | Tee-Object -FilePath target/test-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain validation log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laqay-validation-log
          path: target/test-results.log
          if-no-files-found: ignore
      - name: Check real disk-full writer failure and recovery
        shell: pwsh
        run: ./scripts/Test-StorageFailure.ps1
      - name: Retain isolated storage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laqay-storage-validation
          path: |
            target/storage-failure-report.json
            target/storage-test-results.log
            target/storage-diskpart.log
          if-no-files-found: ignore
      - name: Check SMB withdrawal before publication and fresh-image recovery
        shell: pwsh
        run: ./scripts/Test-ShareFailure.ps1
      - name: Retain isolated share evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laqay-share-validation
          path: |
            target/share-failure-report.json
            target/share-test-results.log
            target/share-test-stderr.log
            target/share-build.log
          if-no-files-found: ignore
      - run: cargo build --locked --release
      - name: Check normal-mode preference persistence in the isolated VM
        shell: pwsh
        run: |
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) {
            Start-Process explorer.exe -WindowStyle Hidden
            Start-Sleep -Seconds 3
          }
          powershell -NoProfile -File scripts/Invoke-PreferencesProbe.ps1 -PrepareOnly
          if ($LASTEXITCODE -ne 0) { throw 'Preference helper preparation failed.' }
          foreach ($scenario in @('Enabled', 'Startup', 'SessionEnd')) {
            powershell -NoProfile -File scripts/Invoke-PreferencesProbe.ps1 -Scenario $scenario -Automated -Seconds 30 -OutputDirectory target/preference-validation
            if ($LASTEXITCODE -ne 0) { throw "Application preference check failed: $scenario" }
          }
      - name: Retain application preference reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laqay-preference-validation
          path: target/preference-validation/
          if-no-files-found: ignore
      - name: Collect dependency notices
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 | Set-Content -Encoding utf8 target/metadata.json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          python scripts/collect-cargo-licenses.py target/metadata.json target/THIRD_PARTY_LICENSES.txt
          if ($LASTEXITCODE -ne 0) { throw 'License collection failed.' }
      - name: Package executable and licenses
        shell: pwsh
        run: |
          ./scripts/New-Distribution.ps1 -BinaryPath target/release/laqay.exe -LicenseTextPath target/THIRD_PARTY_LICENSES.txt
          python scripts/check-distribution.py --binary target/release/laqay.exe --archive target/laqay-windows-x86_64.zip --licenses target/THIRD_PARTY_LICENSES.txt --checksums target/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Distribution validation failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laqay-windows-x86_64
          path: |
            target/release/laqay.exe
            target/laqay-windows-x86_64.zip
            target/SHA256SUMS.txt
          if-no-files-found: error

  provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: laqay-windows-x86_64
          path: delivery
      - name: Attest development build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            delivery/release/laqay.exe
            delivery/laqay-windows-x86_64.zip
            delivery/SHA256SUMS.txt
          create-storage-record: false
      - name: Verify development build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          for file in delivery/release/laqay.exe delivery/laqay-windows-x86_64.zip delivery/SHA256SUMS.txt; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-digest "$SOURCE_COMMIT" --source-ref refs/heads/main --deny-self-hosted-runners
          done
